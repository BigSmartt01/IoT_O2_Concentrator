; PlatformIO build for Arduino sketch in this folder
[platformio]
src_dir = .
include_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
; Async stack: ESP32Async only — do not use me-no-dev AsyncTCP / ESPAsyncWebServer
lib_deps =
	marcoschwartz/LiquidCrystal_I2C@^1.1.2
	vshymanskyy/TinyGSM@^0.12.0
	https://github.com/ESP32Async/AsyncTCP.git
	https://github.com/ESP32Async/ESPAsyncWebServer.git
build_flags =
	-DCORE_DEBUG_LEVEL=0
lib_ldf_mode = deep+
